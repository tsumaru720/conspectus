<section class="card">
  <h2>Return over time</h2>
  <p class="card-sub">The money gap between what this class's assets are worth and what you paid in (value − deposits), month by month.</p>
  <div class="chart-box"><canvas id="chart-class-money-return"></canvas></div>
  <script type="application/json" class="chart-data" data-chart="chart-class-money-return" data-type="line">
    {{json .Charts.Return}}
  </script>
</section>
