<section class="card">
  <h2>Monthly changes</h2>
  <div class="two-col">
    <div>
      <h3>Change in return</h3>
      <div class="chart-box"><canvas id="chart-class-dreturn"></canvas></div>
      <script type="application/json" class="chart-data" data-chart="chart-class-dreturn" data-type="bar" data-sign-color="1">
        {{json .Charts.MonthlyReturn}}
      </script>
    </div>
    <div>
      <h3>Change in deposits</h3>
      <div class="chart-box"><canvas id="chart-class-ddeposits"></canvas></div>
      <script type="application/json" class="chart-data" data-chart="chart-class-ddeposits" data-type="bar" data-sign-color="1">
        {{json .Charts.MonthlyFlow}}
      </script>
    </div>
  </div>
</section>
